name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via rsync
        run: |
          sudo apt-get install -y sshpass rsync
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -azr --delete \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            out/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_BASE_PATH }}/
